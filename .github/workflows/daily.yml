name: Donation Email Pipeline
 
on:
  schedule:
    # Times are UTC. Kyiv is UTC+3 in summer, UTC+2 in winter.
    #
    # GitHub does not run scheduled workflows on time - they queue, and the
    # top of the hour is the busiest slot. Measured on this repo, "0 7"
    # (nominally 10:00 Kyiv) actually landed between 11:17 and 13:48 Kyiv
    # over 07-12 Aug: a delay of 1h17m to 3h48m, median about 2h20m.
    #
    # The fetch is therefore scheduled early and off the round minute, so it
    # lands near 10:00 Kyiv in practice. If GitHub ever runs it on time it
    # fires at 07:40 Kyiv, which is harmless - the table is just ready sooner.
    # For an exact 10:00 the trigger has to come from outside GitHub, via the
    # repository_dispatch 'fetch' event below.
    - cron: "40 4 * * *"
    - cron: "0 13 * * *"
  repository_dispatch:
    types: [fetch, send_drafts]
  workflow_dispatch:
    inputs:
      job:
        description: "Which job to run manually"
        required: true
        default: "fetch"
        type: choice
        options:
          - fetch
          - send_drafts
 
jobs:
  fetch-donations:
    if: |
      (github.event_name == 'schedule' && github.event.schedule == '40 4 * * *') ||
      (github.event_name == 'repository_dispatch' && github.event.action == 'fetch') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'fetch')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
 
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
 
      - name: Install dependencies
        run: pip install requests pytz translitua==1.3.2
 
      - name: Run fetch_donations.py
        env:
          ZOHO_CLIENT_ID: ${{ secrets.ZOHO_CLIENT_ID }}
          ZOHO_CLIENT_SECRET: ${{ secrets.ZOHO_CLIENT_SECRET }}
          ZOHO_REFRESH_TOKEN: ${{ secrets.ZOHO_REFRESH_TOKEN }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
        run: python fetch_donations.py
 
  send-drafts:
    if: |
      (github.event_name == 'schedule' && github.event.schedule == '0 13 * * *') ||
      (github.event_name == 'repository_dispatch' && github.event.action == 'send_drafts') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'send_drafts')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
 
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
 
      - name: Install dependencies
        run: pip install requests pytz google-auth google-auth-oauthlib google-api-python-client
 
      - name: Run send_emails.py
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          GMAIL_SVITLANA_CLIENT_ID: ${{ secrets.GMAIL_SVITLANA_CLIENT_ID }}
          GMAIL_SVITLANA_CLIENT_SECRET: ${{ secrets.GMAIL_SVITLANA_CLIENT_SECRET }}
          GMAIL_SVITLANA_REFRESH_TOKEN: ${{ secrets.GMAIL_SVITLANA_REFRESH_TOKEN }}
          GMAIL_TYMOFIY_CLIENT_ID: ${{ secrets.GMAIL_TYMOFIY_CLIENT_ID }}
          GMAIL_TYMOFIY_CLIENT_SECRET: ${{ secrets.GMAIL_TYMOFIY_CLIENT_SECRET }}
          GMAIL_TYMOFIY_REFRESH_TOKEN: ${{ secrets.GMAIL_TYMOFIY_REFRESH_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SVITLANA_TELEGRAM_USER_ID: ${{ secrets.SVITLANA_TELEGRAM_USER_ID }}
        run: python send_emails.py
 

