name: Donation Email Pipeline

on:
  # Runs every day at 10am Kyiv time (UTC+3 = 7am UTC)
  schedule:
    - cron: "0 7 * * *"

  # Triggered by Notion webhook when Approved checkbox is ticked
  repository_dispatch:
    types: [notion-approved]

  # Allows manual runs from GitHub Actions UI for testing
  workflow_dispatch:

jobs:
  fetch-donations:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests google-auth google-auth-oauthlib google-api-python-client

      - name: List files in directory
        run: ls -R
        
      - name: Run fetch_donations.py
        env:
          ZOHO_CLIENT_ID: ${{ secrets.ZOHO_CLIENT_ID }}
          ZOHO_CLIENT_SECRET: ${{ secrets.ZOHO_CLIENT_SECRET }}
          ZOHO_REFRESH_TOKEN: ${{ secrets.ZOHO_REFRESH_TOKEN }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
        run: python fetch_donations.py

  send-emails:
    if: github.event_name == 'repository_dispatch' && github.event.action == 'notion-approved'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests google-auth google-auth-oauthlib google-api-python-client

      - name: Run send_emails.py
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          GMAIL_CEO_CLIENT_ID: ${{ secrets.GMAIL_CEO_CLIENT_ID }}
          GMAIL_CEO_CLIENT_SECRET: ${{ secrets.GMAIL_CEO_CLIENT_SECRET }}
          GMAIL_CEO_REFRESH_TOKEN: ${{ secrets.GMAIL_CEO_REFRESH_TOKEN }}
          GMAIL_PRESIDENT_CLIENT_ID: ${{ secrets.GMAIL_PRESIDENT_CLIENT_ID }}
          GMAIL_PRESIDENT_CLIENT_SECRET: ${{ secrets.GMAIL_PRESIDENT_CLIENT_SECRET }}
          GMAIL_PRESIDENT_REFRESH_TOKEN: ${{ secrets.GMAIL_PRESIDENT_REFRESH_TOKEN }}
        run: python send_emails.py
